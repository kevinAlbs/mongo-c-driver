language = "C"
style = "type"

include_guard = "MONGOC_RUST_H"
autogen_warning = "/* Generated by src/rust/CMakeLists.txt */"
include_version = true
sys_includes = ["bson/bson.h", "stdbool.h", "stdint.h"]
no_includes = true
cpp_compat = true

braces = "NextLine"
line_length = 120
tab_width = 3
documentation = true
documentation_style = "c99"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[export]
exclude = ["BsonValueC"]

[export.rename]
"BsonValueC" = "bson_value_t"
"ApmCallbacks" = "mongoc_async_apm_callbacks_t"
"BsonOwned" = "bson_owned_t"
"CCommandStartedEvent" = "mongoc_async_command_started_event_t"
"CCommandSucceededEvent" = "mongoc_async_command_succeeded_event_t"
"CCommandFailedEvent" = "mongoc_async_command_failed_event_t"
"Client" = "mongoc_async_client_t"
"Collection" = "mongoc_async_collection_t"
"Cursor" = "mongoc_async_cursor_t"
"Database" = "mongoc_async_database_t"
"Error" = "mongoc_async_error_t"
"ErrorCode" = "mongoc_async_error_code"
"Future" = "mongoc_async_future_t"
"BsonView" = "bson_unowned_t"
"InsertOneOpts" = "mongoc_async_insert_one_opts_t"
"InsertManyOpts" = "mongoc_async_insert_many_opts_t"
"FindOpts" = "mongoc_async_find_opts_t"
"UpdateOpts" = "mongoc_async_update_opts_t"
"DeleteOpts" = "mongoc_async_delete_opts_t"
"FindOneAndOpts" = "mongoc_async_find_one_and_opts_t"
"CountOpts" = "mongoc_async_count_opts_t"
"AggregateOpts" = "mongoc_async_aggregate_opts_t"
"Session" = "mongoc_async_session_t"
"ChangeStream" = "mongoc_async_change_stream_t"
"RuntimeHandle" = "mongoc_async_runtime_handle_t"
